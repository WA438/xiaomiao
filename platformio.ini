; PlatformIO Project Configuration for 学而思小喵 ESP32 Handheld
; Xiaomiao ESP32 Handheld Console Firmware

[env:xiaomiao]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino

; ── Serial Monitor ──
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Build Flags ──
build_flags =
    -DUSER_SETUP_LOADED
    -DST7735_DRIVER
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_BLACKTAB
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=19
    -DTFT_BL=-1
    -DTFT_MOSI=23
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DMARAUDER_V6
    -DMARAUDER_SD
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -w

; ── Libraries ──
lib_deps =
    ; TFT_eSPI — official Bodmer library (more stable for ST7735)
    bodmer/TFT_eSPI@^2.5.43
    ; NimBLE-Arduino — BLE stack (v2.3.0: init/deinit fixes, bond fixes)
    h2zero/NimBLE-Arduino@^2.3.0
    ; ArduinoJson — JSON handling (v6.21.6: CVE-2025-53540 buffer overflow fix)
    bblanchon/ArduinoJson@^6.21.6
    ; JPEGDecoder — JPEG wallpaper support
    Bodmer/JPEGDecoder@^1.8.0

; ── Partition Scheme (OTA — matches baseline) ──
board_build.partitions = partitions_ota.csv

; ── Upload Settings ──
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_flash = 80000000L